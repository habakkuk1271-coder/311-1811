<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2536"><link rel="manifest" href="manifest.webmanifest"><title>311／1811 活動站</title><style>body{margin:0;background:#f3f6f8;color:#132534;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{background:#0f2536;color:#fff;padding:34px 20px}main{max-width:760px;margin:auto;padding:16px}section{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #10203012}h1{margin:0;font-size:28px}h2{margin:0 0 10px;font-size:19px}p{line-height:1.65}.tag{color:#6d7d87;font-size:13px}.event{border-left:5px solid #df9e35}.warn{color:#7d5b16;background:#fff4dc;padding:10px;border-radius:10px}a{color:#096f91}ul{padding-left:22px}footer{text-align:center;color:#6d7d87;padding:18px}img,video{max-width:100%;border-radius:10px}</style></head><body><header><h1>311／1811 活動站</h1><div>公告、操練與活動資訊</div></header><main id="app"><section><p>正在載入最新資料…</p></section></main><footer>311／1811</footer><script src="v2/config.js"></script><script src="v2/api.js"></script><script>(function(){const app=document.getElementById('app');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=v=>v&&/^https?:\/\//i.test(v)?'<p><a target="_blank" rel="noopener" href="'+esc(v)+'">開啟連結</a></p>':'';function items(x){return (x&&x.items||[]).map(v=>'<li>'+esc(v)+'</li>').join('')||'<li>暫無內容</li>'}function event(e){if(!e)return '<section class="event"><h2>下一場活動</h2><p>待公布</p></section>';return '<section class="event"><h2>'+esc(e.title||'下一場活動')+'</h2><p>'+esc(e.date||'日期待公布')+'　'+esc(e.location||'')+'</p><p>'+esc(e.description||'')+'</p>'+link(e.map_url)+link(e.signup_url)+'</section>'}function archive(rows){if(!rows||!rows.length)return '<section><h2>歷次活動</h2><p>歷史活動整理中。</p></section>';return '<section><h2>歷次活動</h2>'+rows.map(e=>'<article><strong>'+esc(e.title||'活動')+'</strong><br><span class="tag">'+esc(e.date||'')+'</span><p>'+esc(e.description||'')+'</p>'+link(e.album_url||e.detail_url||e.photo_url)+'</article>').join('')+'</section>'}function render(d,cached){app.innerHTML=(cached?'<p class="warn">目前顯示上次成功取得的資料；系統將在網路恢復後更新。</p>':'')+'<section><h2>公告</h2><p>'+esc(d.notice&&d.notice.badge||'最新公告')+'</p><ul>'+items(d.notice)+'</ul></section><section><h2>本週操練</h2><p>'+esc(d.practice&&d.practice.week||d.practice&&d.practice.title||'本週安排')+'</p><ul>'+items(d.practice)+'</ul></section>'+event(d.event)+archive(d.archive)+'<section><h2>8／22 AR 躲避球紀錄</h2><p>即時記分已退役，歷史活動內容仍保留。</p><p><a href="score.html">查看歷史記分與媒體紀錄</a></p></section>'}SiteAPI.getPublic().then(x=>render(x.data,x.cached)).catch(()=>{app.innerHTML='<section><h2>暫時無法取得活動資料</h2><p>請稍後重新整理；已儲存的資料會在網路恢復時自動更新。</p></section>'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();</script></body></html>
