<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>311／1811 管理後台</title><style>body{max-width:820px;margin:auto;padding:18px;background:#f3f6f8;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#142633}fieldset{border:0;background:#fff;border-radius:14px;margin:14px 0;padding:18px}legend{font-weight:700;font-size:19px}label{display:block;margin:10px 0 4px}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c8d0;border-radius:8px;font:inherit}textarea{min-height:80px}button{padding:11px 16px;border:0;border-radius:8px;background:#0f637f;color:#fff;font:inherit;margin:8px 6px 0 0}.secondary{background:#516975}.danger{background:#a84b40}.hint{color:#637581}.ok{color:#176b43}.bad{color:#a33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>311／1811 每週管理</h1><p class="hint">每次更新：填好內容 → 輸入 ADMIN_TOKEN → 按發布 → 重新載入確認。驗證碼不會儲存或公開。</p><form id="editor"><fieldset><legend>管理驗證</legend><label>ADMIN_TOKEN<input id="token" type="password" autocomplete="current-password"></label></fieldset><fieldset><legend>公告</legend><label>公告標題<input id="noticeBadge"></label><label>公告項目（每行一項）<textarea id="noticeItems"></textarea></label></fieldset><fieldset><legend>本週操練</legend><label>標題<input id="practiceTitle"></label><label>日期範圍<input id="practiceDate"></label><label>操練項目（每行一項）<textarea id="practiceItems"></textarea></label><label>提醒<input id="practiceNote"></label></fieldset><fieldset><legend>目前活動</legend><label>快速套用活動模板<select id="template"><option value="">不套用模板</option></select></label><button type="button" id="apply" class="secondary">套用模板</button><div class="grid"><label>活動 ID（保留可更新目前活動）<input id="eventId"></label><label>活動名稱<input id="eventTitle"></label><label>日期文字<input id="eventDate"></label><label>開始時間<input id="eventStart"></label><label>集合時間<input id="eventMeeting"></label><label>地點<input id="eventPlace"></label><label>參加對象<input id="eventAudience"></label><label>費用<input id="eventFee"></label></div><label>攜帶物品<input id="eventPacking"></label><label>活動說明<input id="eventStatus"></label><label>地圖連結<input id="eventMap" type="url"></label><label>報名連結<input id="eventSignup" type="url"></label><button type="button" id="archive" class="danger">封存目前活動</button><p class="hint">封存會把目前活動標為 archived，並以活動 ID 寫入／更新歷次活動；不會產生重複紀錄。</p></fieldset><button type="submit">發布更新</button><button type="button" id="reload" class="secondary">重新載入確認</button><p id="status" class="hint"></p></form><iframe name="postframe" hidden></iframe><form id="post" method="post" target="postframe" hidden><input name="payload" id="payload"></form><script src="v2/config.js"></script><script src="v2/api.js"></script><script>(function(){const q=id=>document.getElementById(id),status=q('status');let templates=[];const lines=id=>q(id).value.split('\n').map(x=>x.trim()).filter(Boolean);const set=(id,v)=>q(id).value=v||'';const send=x=>{const token=q('token').value;if(!token){status.className='bad';status.textContent='請輸入 ADMIN_TOKEN';return}q('payload').value=JSON.stringify(Object.assign({token:token},x));q('post').action=String(APP_CONFIG.API_URL).replace(/[/]$/,'');q('post').submit();status.className='ok';status.textContent='已送出。請按「重新載入確認」檢查公開資料。'};function load(){status.className='hint';status.textContent='讀取中…';SiteAPI.getPublic().then(x=>{const d=x.data,n=d.notice||{},p=d.practice||{},e=d.event||{};set('noticeBadge',n.badge);set('noticeItems',(n.items||[]).join('\n'));set('practiceTitle',p.title);set('practiceDate',p.date_range);set('practiceItems',(p.items||[]).join('\n'));set('practiceNote',p.note);set('eventId',e.event_id);set('eventTitle',e.title);set('eventDate',e.date);set('eventStart',e.start_at);set('eventMeeting',e.meeting_time);set('eventPlace',e.location);set('eventAudience',e.audience);set('eventFee',e.fee);set('eventPacking',e.packing);set('eventStatus',e.description);set('eventMap',e.map_url);set('eventSignup',e.signup_url);templates=d.templates||[];q('template').innerHTML='<option value="">不套用模板</option>'+templates.map(t=>'<option value="'+String(t.template_id||'').replace(/"/g,'')+'">'+String(t.name||t.title||'模板')+'</option>').join('');status.className='ok';status.textContent=x.cached?'已載入快取資料':'已載入目前公開內容';}).catch(e=>{status.className='bad';status.textContent='讀取失敗：'+e.message})}q('apply').onclick=()=>{const t=templates.find(x=>x.template_id===q('template').value);if(!t)return;set('eventTitle',t.title);set('eventAudience',t.audience);set('eventFee',t.fee);set('eventPacking',t.packing);status.className='ok';status.textContent='已套用模板，可再修改日期、地點與說明。'};q('archive').onclick=()=>{const id=q('eventId').value;if(!id){status.className='bad';status.textContent='目前沒有可封存的活動';return}if(confirm('確定封存目前活動？'))send({action:'archive',event_id:id})};q('reload').onclick=load;q('editor').onsubmit=e=>{e.preventDefault();send({action:'save',data:{notice:{badge:q('noticeBadge').value,items:lines('noticeItems')},practice:{title:q('practiceTitle').value,date_range:q('practiceDate').value,items:lines('practiceItems'),note:q('practiceNote').value},event:{event_id:q('eventId').value,title:q('eventTitle').value,date_text:q('eventDate').value,start_at:q('eventStart').value,meeting_time:q('eventMeeting').value,place:q('eventPlace').value,audience:q('eventAudience').value,fee:q('eventFee').value,packing:q('eventPacking').value,status:q('eventStatus').value,map_url:q('eventMap').value,signup_url:q('eventSignup').value,lifecycle:'current'}}})};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();</script></body></html>
