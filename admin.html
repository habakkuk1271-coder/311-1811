<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>311／1811 管理</title><style>body{max-width:720px;margin:auto;padding:18px;background:#f3f6f8;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#142633}fieldset{border:0;background:#fff;border-radius:14px;margin:14px 0;padding:18px}label{display:block;margin:10px 0 4px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c8d0;border-radius:8px;font:inherit}textarea{min-height:92px}button{padding:11px 16px;border:0;border-radius:8px;background:#0f637f;color:#fff;font:inherit;margin:8px 6px 0 0}.hint{color:#637581}.ok{color:#176b43}.bad{color:#a33}</style></head><body><h1>311／1811 管理</h1><p class="hint">管理密碼只會隨本次發布送往 Apps Script，不會寫入 GitHub 或公開頁。</p><form id="editor"><fieldset><legend>管理驗證</legend><label>ADMIN_TOKEN<input id="token" type="password" autocomplete="current-password"></label></fieldset><fieldset><legend>公告</legend><label>標題<input id="noticeTitle"></label><label>項目（每行一項）<textarea id="noticeItems"></textarea></label></fieldset><fieldset><legend>本週操練</legend><label>週次／標題<input id="practiceTitle"></label><label>項目（每行一項）<textarea id="practiceItems"></textarea></label></fieldset><fieldset><legend>目前活動</legend><label>活動 ID（新活動可留空）<input id="eventId"></label><label>標題<input id="eventTitle"></label><label>日期<input id="eventDate"></label><label>地點<input id="eventLocation"></label><label>說明<textarea id="eventDescription"></textarea></label><label>報名／內容連結<input id="eventLink" type="url"></label></fieldset><button type="submit">發布更新</button><button type="button" id="reload">重新載入</button><p id="status" class="hint"></p></form><iframe name="postframe" hidden></iframe><form id="post" method="post" target="postframe" hidden><input name="payload" id="payload"></form><script src="v2/config.js"></script><script src="v2/api.js"></script><script>(function(){const q=id=>document.getElementById(id),status=q('status');const lines=id=>q(id).value.split('\n').map(x=>x.trim()).filter(Boolean);function set(id,v){q(id).value=v||''}function load(){status.className='hint';status.textContent='讀取中…';SiteAPI.getPublic().then(x=>{const d=x.data,n=d.notice||{},p=d.practice||{},e=d.event||{};set('noticeTitle',n.title);set('noticeItems',(n.items||[]).join('\n'));set('practiceTitle',p.week||p.title);set('practiceItems',(p.items||[]).join('\n'));set('eventId',e.event_id);set('eventTitle',e.title);set('eventDate',e.date);set('eventLocation',e.location);set('eventDescription',e.description);set('eventLink',e.link||e.registration_url);status.className='ok';status.textContent=x.cached?'已載入快取資料':'已載入目前公開內容';}).catch(e=>{status.className='bad';status.textContent='讀取失敗：'+e.message})}q('reload').onclick=load;q('editor').onsubmit=e=>{e.preventDefault();const token=q('token').value;if(!token){status.className='bad';status.textContent='請輸入管理驗證碼';return}const data={notice:{title:q('noticeTitle').value,items:lines('noticeItems')},practice:{week:q('practiceTitle').value,items:lines('practiceItems')},event:{event_id:q('eventId').value,title:q('eventTitle').value,date:q('eventDate').value,location:q('eventLocation').value,description:q('eventDescription').value,link:q('eventLink').value,lifecycle:'current'}};q('payload').value=JSON.stringify({action:'save',token:token,data:data});q('post').action=String(APP_CONFIG.API_URL).replace(/[/]$/,'');q('post').submit();status.className='ok';status.textContent='已送出發布，請按「重新載入」確認最新內容。'};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();</script></body></html>
